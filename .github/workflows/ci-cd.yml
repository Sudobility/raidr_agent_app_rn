---
# CI/CD workflow for raidr_agent_app_rn
#
# Runs the unified reusable workflow: bun install, `bun run typecheck`,
# `bun run lint`, `bun run test:unit` (there is no `build` script, so the build
# step is skipped). This is an app, so npm publishing is always skipped; the
# NPM_TOKEN secret is only used to install private @sudobility packages.

name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The reusable workflow's jobs request the union of these scopes; a caller that
# grants fewer fails at startup even though the publish/deploy jobs skip.
permissions:
  contents: write
  id-token: write
  deployments: write
  packages: write

jobs:
  cicd:
    uses: johnqh/workflows/.github/workflows/unified-cicd.yml@main
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      GIT_DEP_TOKEN: ${{ secrets.GIT_DEP_TOKEN }}
      GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
    with:
      skip-npm-publish: true
      publish-target: github
