// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    // Previously injected by Expo's `expo-root-project` gradle plugin; now
    // declared here as a bare React Native project (values match RN 0.83 /
    // the rest of the family, e.g. music_app_rn).
    buildToolsVersion = "36.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.1.20"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('com.google.gms:google-services:4.5.0')
    classpath('com.google.firebase:firebase-crashlytics-gradle:3.0.8')
    classpath('com.google.firebase:perf-plugin:2.0.2')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "com.facebook.react.rootproject"
